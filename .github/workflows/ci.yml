name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint + smoke
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: fastapi_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fastapi_app/requirements.txt

      - name: Install system deps for judger
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ default-jdk-headless
          g++ --version | head -1
          java -version 2>&1 | head -1

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Ruff lint
        run: ruff check --select=E9,F63,F7,F82,F401,F811 --no-cache . || true

      - name: Build frontend (for backend smoke)
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Smoke test — приложение запускается
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          DEBUG: "true"
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
        run: |
          python -c "
          import asyncio
          from main import app
          from app.db.database import init_db
          asyncio.run(init_db())
          routes = [r.path for r in app.routes if hasattr(r, 'path')]
          assert '/api/auth/login' in routes
          assert '/api/problems/' in routes
          assert '/api/stats/dashboard' in routes
          print(f'OK: {len(routes)} routes registered')
          "

      - name: Smoke test — полный пайплайн судьи
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          DEBUG: "true"
          JUDGER_BACKEND: subprocess
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
        run: |
          python -c "
          import asyncio
          from httpx import AsyncClient, ASGITransport
          from main import app
          from app.db.database import init_db

          async def run():
              await init_db()
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://t') as c:
                  r = await c.post('/api/auth/login', json={'login':'demo','password':'Demo1234'})
                  assert r.status_code == 200, f'login failed: {r.status_code}'
                  token = r.json()['access_token']
                  hdr = {'Authorization': f'Bearer {token}'}
                  r = await c.post('/api/problems/submissions', headers=hdr, json={
                      'problem_id': 1,
                      'language': 'python3',
                      'code': 'a, b = map(int, input().split()); print(a + b)',
                  })
                  assert r.status_code == 201
                  sid = r.json()['id']
                  for _ in range(20):
                      await asyncio.sleep(0.5)
                      r = await c.get(f'/api/problems/submissions/{sid}', headers=hdr)
                      v = r.json()['verdict']
                      if v not in ('pending', 'judging'):
                          break
                  assert v == 'accepted', f'expected accepted, got {v}'
                  print(f'OK: verdict={v}')

          asyncio.run(run())
          "

      - name: Smoke test — C++ judger
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          DEBUG: "true"
          JUDGER_BACKEND: subprocess
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
        run: |
          python -c "
          import asyncio
          from httpx import AsyncClient, ASGITransport
          from main import app
          from app.db.database import init_db

          async def run():
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://t') as c:
                  r = await c.post('/api/auth/login', json={'login':'demo','password':'Demo1234'})
                  token = r.json()['access_token']
                  hdr = {'Authorization': f'Bearer {token}'}
                  code = '#include <bits/stdc++.h>\nusing namespace std;\nint main() {\n    int a, b; cin >> a >> b;\n    cout << a + b << \"\\n\";\n    return 0;\n}\n'
                  r = await c.post('/api/problems/submissions', headers=hdr, json={
                      'problem_id': 1,
                      'language': 'cpp17',
                      'code': code,
                  })
                  sid = r.json()['id']
                  for _ in range(30):
                      await asyncio.sleep(0.7)
                      r = await c.get(f'/api/problems/submissions/{sid}', headers=hdr)
                      v = r.json()['verdict']
                      if v not in ('pending', 'judging'):
                          break
                  assert v == 'accepted', f'expected accepted, got {v}'
                  print(f'OK: C++ verdict={v}')

          asyncio.run(run())
          "

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-db-py${{ matrix.python-version }}
          path: fastapi_app/ci-test.db
          retention-days: 3

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build frontend
        run: npm run build

      - name: Verify bundle size
        run: |
          SIZE=$(stat -c%s dist/assets/*.js | head -1)
          echo "Frontend bundle size: ${SIZE} bytes"
          if [ "$SIZE" -gt 250000 ]; then
            echo "::warning::Bundle exceeds 250 KB"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: fastapi_app
          push: false
          tags: tajik-fire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка /health
        run: |
          docker run --rm -d --name tf-ci -p 8777:8000 \
            -e SECRET_KEY=ci-secret \
            -e DEBUG=true \
            tajik-fire:ci
          sleep 8
          curl -fsS http://localhost:8777/health | grep -q healthy
          docker stop tf-ci || true
          echo "OK: Docker контейнер работает"

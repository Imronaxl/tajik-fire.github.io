name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: fastapi_app/requirements.txt

      - name: Install system deps for judger
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++ default-jdk-headless
          g++ --version | head -1
          java -version 2>&1 | head -1

      - name: Install Python deps
        working-directory: fastapi_app
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff

      - name: Ruff lint
        working-directory: fastapi_app
        run: ruff check --select=E9,F63,F7,F82 --no-cache . || true

      - name: Run unit + integration tests
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          DEBUG: "true"
          FRONTEND_DIST: ""
          PYTHONPATH: fastapi_app
        run: |
          pytest tests/unit tests/integration -v --tb=short

      - name: Smoke test — приложение запускается
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          DEBUG: "true"
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          PYTHONPATH: fastapi_app
        run: |
          python << 'EOF'
          import asyncio
          from main import app
          from app.db.database import init_db

          asyncio.run(init_db())

          routes = []
          for r in app.routes:
              path = getattr(r, 'path', None)
              if path:
                  routes.append(path)

          print(f"Total routes: {len(routes)}")
          for required in ['/api/auth/login', '/api/problems', '/api/stats/dashboard', '/api/ai/status']:
              found = any(r == required or r.startswith(required) for r in routes)
              print(f"  {required}: {'OK' if found else 'MISSING'}")
              if not found:
                  raise SystemExit(f"Required route missing: {required}")

          print("OK: app boots, all critical routes registered")
          EOF

      - name: Smoke test — judger pipeline (Python + C++)
        env:
          SECRET_KEY: ci-secret-key-not-for-production
          DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
          DEBUG: "true"
          JUDGER_BACKEND: subprocess
          FRONTEND_DIST: ${{ github.workspace }}/frontend/dist
          PYTHONPATH: fastapi_app
        run: |
          python << 'PYEOF'
          import asyncio
          from httpx import AsyncClient, ASGITransport
          from main import app
          from app.db.database import init_db

          async def run():
              await init_db()
              transport = ASGITransport(app=app)
              async with AsyncClient(transport=transport, base_url='http://t') as c:
                  r = await c.post('/api/auth/login', json={'login':'demo','password':'Demo1234'})
                  assert r.status_code == 200, f'login failed: {r.status_code}'
                  token = r.json()['access_token']
                  hdr = {'Authorization': f'Bearer {token}'}

                  # Python
                  r = await c.post('/api/problems/submissions', headers=hdr, json={
                      'problem_id': 1,
                      'language': 'python3',
                      'code': 'a, b = map(int, input().split()); print(a + b)',
                  })
                  assert r.status_code == 201
                  sid = r.json()['id']
                  for _ in range(20):
                      await asyncio.sleep(0.5)
                      r = await c.get(f'/api/problems/submissions/{sid}', headers=hdr)
                      v = r.json()['verdict']
                      if v not in ('pending', 'judging'):
                          break
                  assert v == 'accepted', f'expected accepted, got {v}'
                  print(f'OK: Python verdict={v}')

                  # AI assistant
                  r = await c.get('/api/ai/status')
                  assert r.status_code == 200
                  r = await c.post('/api/ai/chat', json={'message':'hi','language':'tg'})
                  assert r.status_code == 200
                  print(f'OK: AI chat works')

          asyncio.run(run())
          PYEOF

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-db-py${{ matrix.python-version }}
          path: fastapi_app/ci-test.db
          retention-days: 3

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Verify bundle size
        run: |
          SIZE=$(stat -c%s dist/assets/*.js 2>/dev/null | head -1 || stat -f%z dist/assets/*.js | head -1)
          echo "Frontend bundle size: ${SIZE} bytes"
          if [ -n "$SIZE" ] && [ "$SIZE" -gt 250000 ]; then
            echo "::warning::Bundle exceeds 250 KB"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend]
    if: github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: fastapi_app/Dockerfile
          push: false
          load: true
          tags: tajik-fire:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Проверка /health
        run: |
          docker run --rm -d --name tf-ci -p 8777:8000 \
            -e SECRET_KEY=ci-secret \
            -e DEBUG=true \
            tajik-fire:ci
          sleep 8
          curl -fsS http://localhost:8777/health | grep -q healthy
          docker stop tf-ci || true
          echo "OK: Docker контейнер работает"

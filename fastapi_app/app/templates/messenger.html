{% extends "base.html" %}

{% block title %}Messenger · DevStudio Pro{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/pages/messenger.css">
{% endblock %}

{% block content %}
<div class="page messenger-page">
  <div class="messenger-layout">
    <aside class="chats-sidebar">
      <header class="chats-sidebar__header">
        <h2>Messages</h2>
        <button class="btn btn--secondary btn--icon btn--sm" id="new-chat-btn" type="button" title="New chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        </button>
      </header>
      <div class="chats-list" id="chats-list">
        <div class="empty-state">
          <div class="spinner"></div>
        </div>
      </div>
    </aside>

    <section class="chat-window">
      <div class="chat-empty" id="chat-empty">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        <h3>Select a conversation</h3>
        <p>Pick a chat from the sidebar or start a new one.</p>
      </div>
      <div class="chat-active" id="chat-active" style="display:none">
        <header class="chat-header">
          <div class="avatar avatar--sm" id="chat-peer-avatar">?</div>
          <div>
            <div class="chat-header__name" id="chat-peer-name">—</div>
            <div class="chat-header__status text-xs text-tertiary">Direct message</div>
          </div>
        </header>
        <div class="chat-messages" id="chat-messages"></div>
        <form class="chat-input" id="chat-form">
          <input class="input" id="chat-input-field" type="text" placeholder="Type a message..." autocomplete="off">
          <button class="btn btn--primary btn--icon" type="submit">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
          </button>
        </form>
      </div>
    </section>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module" src="/static/js/pages/messenger.js"></script>
{% endblock %}

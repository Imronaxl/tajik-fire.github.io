{% extends "base.html" %}

{% block title %}News · DevStudio Pro{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/pages/news.css">
{% endblock %}

{% block content %}
<div class="page news-page">
  <header class="page-header">
    <h1>What's new</h1>
    <p>Product updates, releases and editorial pieces from the DevStudio team.</p>
  </header>

  <div class="news-list" id="news-list">
    <div class="empty-state">
      <div class="spinner"></div>
      <p>Loading news…</p>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script type="module" src="/static/js/pages/news.js"></script>
{% endblock %}

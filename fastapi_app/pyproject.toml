[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic", ".venv", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "E402",  # module-level import not at top of file (allowed for side-effect imports)
    "F401",  # unused import (allowed in __init__.py for re-exports)
    "F403",  # star imports (used intentionally in database.py)
    "F405",  # may be undefined from star imports
]

[tool.ruff.lint.per-file-ignores]
"app/db/database.py" = ["F401", "F403"]
"app/models/__init__.py" = ["F401"]
"app/api/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
